name: Release

# Push a tag like v0.1.0 to build, package and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive version from tag
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag '$REF_NAME' is not vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Core unit tests
        run: swift test
      - name: Build NachoCombo.app (universal, ad-hoc signed)
        env:
          UNIVERSAL: "1"
          VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/build-app.sh
      - name: Verify bundle
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          lipo -archs build/NachoCombo.app/Contents/MacOS/NachoCombo
          codesign --verify --verbose build/NachoCombo.app
          if strings -a build/NachoCombo.app/Contents/MacOS/NachoCombo | grep -E '/Users/|/home/'; then
            echo "build-machine path embedded in binary" >&2; exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/NachoCombo.app/Contents/Info.plist)" = "$VERSION"
      - name: Package (zip, dmg, SHA256SUMS)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
          sparse-checkout: docs/release-notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          Nacho Combo $VERSION for macOS 12 (Monterey) or later. Universal binary (Apple Silicon + Intel).
          NOTES
          # What is new in this version, when the repository has notes for it (docs/release-notes/vX.Y.Z.md).
          if [ -f "src/docs/release-notes/$TAG.md" ]; then
            { echo; cat "src/docs/release-notes/$TAG.md"; } >> notes.md
          fi
          cat >> notes.md <<NOTES

          **Not notarized.** This build is ad-hoc signed, not signed with an Apple Developer ID.
          On first launch macOS Gatekeeper will block it: right-click the app, choose Open, then
          Open again (or allow it under System Settings > Privacy & Security). Rebuilding or
          updating changes the code signature, so the Accessibility permission for window
          snapping must be granted again.

          Verify your download against \`SHA256SUMS.txt\`:
          \`shasum -a 256 -c SHA256SUMS.txt\`
          NOTES
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Nacho Combo $VERSION" \
            --notes-file notes.md
