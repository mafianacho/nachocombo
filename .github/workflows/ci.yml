name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Core unit tests
        run: swift test
      - name: Auto-update round trip (mock GitHub Releases, real ditto and codesign)
        run: scripts/update-roundtrip.sh
      - name: Build NachoCombo.app (universal, ad-hoc signed)
        env:
          UNIVERSAL: "1"
        run: scripts/build-app.sh
      - name: Verify bundle
        run: |
          lipo -archs build/NachoCombo.app/Contents/MacOS/NachoCombo
          codesign --verify --verbose build/NachoCombo.app
          if strings -a build/NachoCombo.app/Contents/MacOS/NachoCombo | grep -E '/Users/|/home/'; then
            echo "build-machine path embedded in binary" >&2; exit 1
          fi
